[package]
name = "game_protocol"
version = "0.1.3"
description = "Per-tick state-update and event framing for loft multiplayer games — pure loft, over web + server"
loft = ">=0.8"
api_compatible_with  = "0.1.0"   # oldest own release this is a drop-in for
data_compatible_with = "0.1.0"   # oldest own release whose stored data this reads
repository = "loft-libs-net"

[library]
entry = "src/game_protocol.loft"

[dependencies]
server = ">=0.1"
web    = ">=0.1"
