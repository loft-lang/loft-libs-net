[package]
name = "ssh"
version = "0.1.5"
description = "SSH client for loft — drive an interactive remote shell (e.g. attach tmux) over password auth, never stored. Native-only."
loft = ">=2026.10.20261030"   # the daily that carries the `net` component's ssh natives
api_compatible_with  = "0.1.0"   # oldest own release this is a drop-in for
data_compatible_with = "0.1.0"   # oldest own release whose stored data this reads
repository = "loft-libs-net"

[library]
entry = "src/ssh.loft"

# The natives are loft's `net` component — C over the C runtime's sockets and its vendored
# BearSSL, built beside loft (`make components`) and called through the loft-ffi ABI by the
# interpreter and by every compiled program alike.  Each `#native` is named as it is declared.
[native]
component = "net"

# Native-only: SSH needs real TCP sockets, so this library ships the interpreter and the compiled
# targets and declares no browser (`--html`) target — a browser has no raw socket.
