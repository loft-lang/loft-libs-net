[package]
name = "loft-ssh"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
russh = "0.62"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "net", "io-util", "time"] }
loft-ffi = "0.1"
loft-ffi-macros = "0.1"

[build-dependencies]
loft-ffi-build = "0.2"
