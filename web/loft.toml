[package]
name = "web"
version = "0.5.0"
description = "HTTP client + WebSocket client for loft — the natives are loft's `net` component, so the package builds no crate."
loft = ">=2026.10.20261029"   # the daily that carries the `net` component's web natives
api_compatible_with = "0.4.0"   # ws_handler now declares `WsHandler?`: a DECLARED non-null binding of it stops compiling
data_compatible_with = "0.3.0"
repository = "loft-libs-net"

[library]
entry = "src/web.loft"

# The natives (HTTP, the WebSocket client, the pack builder) are loft's `net` component — C over
# the C runtime's own HTTP client, WebSocket code and TLS, built beside loft (`make components`)
# and called through the loft-ffi ABI by the interpreter and by every compiled program alike.
# Each `#native` is named as it is declared.
[native]
component = "net"
