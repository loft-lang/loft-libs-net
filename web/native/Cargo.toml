[package]
name = "loft-web"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ureq = "2"
loft-ffi = "0.1"
loft-ffi-macros = "0.1"
# TLS for the native WebSocket client (wss://). rustls 0.23 is already resolved via ureq, so this
# adds no new crate version; the `ring` provider avoids a C toolchain. webpki-roots supplies the
# Mozilla trust anchors so certificate validation works with no OS trust-store dependency.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
webpki-roots = "0.26"
# Parse PEM certs from SSL_CERT_FILE so the HTTP client can additionally trust a
# private / test CA (curl's --cacert convention); verification stays on.
rustls-pemfile = "2"

[build-dependencies]
loft-ffi-build = "0.2"
