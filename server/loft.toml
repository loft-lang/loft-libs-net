[package]
name = "server"
version = "0.5.1"
description = "HTTP and WebSocket server for loft: accept TCP, answer requests, run WebSocket connections"
loft = ">=0.8"
api_compatible_with  = "0.3.1"   # oldest own release this is a drop-in for
data_compatible_with = "0.3.1"   # oldest own release whose stored data this reads
repository = "loft-libs-net"

[library]
entry = "src/server.loft"
native = "loft_server"

[native]
crate = "loft-server"

[dependencies]
web = ">=0.1"
