[package]
name = "server"
version = "0.7.2"
description = "HTTP + WebSocket server for loft — TCP sockets + tungstenite via cdylib."
loft = ">=2026.11.0"
api_compatible_with  = "0.7.0"   # four returns now declare `τ?`: a DECLARED non-null binding of one stops compiling
data_compatible_with = "0.3.1"   # oldest own release whose stored data this reads
repository = "loft-libs-net"

[library]
entry = "src/server.loft"
native = "loft_server"

[native]
crate = "loft-server"

[dependencies]
web = ">=0.4"
